<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IroncladBox CrossFit</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>IRONCLAD<span>BOX</span></h1>
                <p>Inicia sesion en tu cuenta</p>
            </div>
            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contrasena</label>
                    <input type="password" id="password" name="password" required placeholder="********" autocomplete="new-password">
                </div>
                <div id="loginMessage" class="auth-message"></div>
                <button type="submit" class="btn btn-primary btn-block">Iniciar Sesion</button>
            </form>
            <div class="auth-footer">
                <p>No tienes cuenta? <a href="/register.html">Registrate</a></p>
            </div>
        </div>
    </div>
    <div id="sessionModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Sesion activa</h2>
            <p>Ya tienes una sesion iniciada como <strong id="currentUserName"></strong></p>
            <button id="cancelBtn" class="btn btn-primary">Ir al Dashboard</button>
            <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesion</button>
        </div>
    </div>
    <script src="/config.js"></script>
    <script src="/js/secure-storage.js?v=3"></script>
    <script src="/js/auth.js?v=3"></script>
</body>
</html>
