<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IroncladBox CrossFit</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h1>IRONCLAD<span>BOX</span></h1>
                <p>Inicia sesión en tu cuenta</p>
            </div>

            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="new-password">
                </div>

                <div id="loginMessage" class="auth-message"></div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN
                </button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
                <p>¿Necesitas ayuda? <a href="/#contact">Contáctanos</a></p>
                <p><a href="/">← Volver al inicio</a></p>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación de sesión activa -->
    <div id="sessionModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Confirmar</h2>
            <p id="sessionModalMessage">Actualmente ha iniciado sesión como <strong id="currentUserName"></strong>, necesita salir antes de volver a entrar con un usuario diferente.</p>
            <div class="modal-buttons">
                <button id="cancelBtn" class="btn btn-secondary">Cancelar</button>
                <button id="logoutBtn" class="btn btn-danger">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script src="/js/secure-storage.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
